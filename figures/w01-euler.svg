  <text x="24" y="30" font-size="17" font-weight="600" fill="#1b3a5c">Three rotations, in this order and no other</text>
  <text x="24" y="52" font-size="13" fill="#55606d">Start from NED and turn three times. Each turn is about the blue axis &#8212; an axis of the frame the previous turn produced, never a fixed one.</text>

