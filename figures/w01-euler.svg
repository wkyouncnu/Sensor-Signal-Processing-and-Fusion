  <text x="24" y="368" font-size="12" fill="#8a95a1">The dashed grey square is the horizontal plane of NED, repeated in every panel. The deck leaves it only when the pitch and roll turns arrive.</text>

  <rect x="150" y="382" width="600" height="42" rx="6" fill="#eef3f8" stroke="#c6d3e0"/>
  <text x="450" y="409" font-size="16" fill="#1b3a5c" text-anchor="middle">
    R<tspan font-size="11" dy="-6">n</tspan><tspan font-size="11" dy="12">b</tspan><tspan dy="-6">(&#920;) = R</tspan><tspan font-size="11" dy="4">z</tspan><tspan dy="-4">(&#968;) &#183; R</tspan><tspan font-size="11" dy="4">y</tspan><tspan dy="-4">(&#952;) &#183; R</tspan><tspan font-size="11" dy="4">x</tspan><tspan dy="-4">(&#966;)</tspan>
  </text>

  <rect x="24" y="438" width="852" height="1" fill="#dfe4ea"/>
  <text x="24" y="460" font-size="12.5" fill="#55606d">Matrix multiplication does not commute, so the order is part of the definition. Reversing it gives a different attitude for the same three numbers.</text>
  <text x="24" y="478" font-size="12.5" fill="#55606d">Read the product right to left: the rightmost rotation is applied first. MSS builds exactly this matrix in <tspan font-family="Consolas, monospace">Rzyx(phi, theta, psi)</tspan>.</text>
</svg>
