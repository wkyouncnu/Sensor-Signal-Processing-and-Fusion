  <polygon points="815.92,193.35 794.32,216.39 727.23,232.69 720.06,226.81 720.10,206.48 727.30,197.11 794.39,180.80 " fill="#F7DCBE" fill-opacity="0.92" stroke="#8a5a2b" stroke-width="1.8"/>
