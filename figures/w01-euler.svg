  <text x="658" y="84" font-size="13.5" font-weight="600" fill="#0073BD" text-anchor="middle">roll <tspan font-style="italic">&#966;</tspan> = 30&#176;</text>
  <text x="658" y="102" font-size="12.5" fill="#0073BD" text-anchor="middle">about x<tspan font-size="9" dy="3">2</tspan></text>

