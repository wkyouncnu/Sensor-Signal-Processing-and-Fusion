  <text x="20" y="30" font-size="19" font-weight="700" fill="#1e293b">A derivative has no upper limit on its gain. A filter gives it one.</text>
  <text x="20" y="52" font-size="15" font-weight="400" fill="#64748b">The two operators agree on everything slow and part company on everything fast &#8212; which is where the noise lives</text>

