  <text x="352" y="128" font-size="13" font-weight="700" fill="#dc2626">ideal  K&#8340; s</text>
  <text x="352" y="144" font-size="12" fill="#dc2626">never flattens</text>
  <line x1="404" y1="132" x2="436" y2="150" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="432" y="213" font-size="13" font-weight="700" fill="#d97706">N = 100</text>
  <text x="432" y="228" font-size="12" fill="#d97706">flat at K&#8340;N = 200</text>
