  <!-- where things live on the axis -->
  <line x1="231.6" y1="96" x2="231.6" y2="84" stroke="#0d9488" stroke-width="1.6"/>
  <text x="228" y="78" font-size="12" font-weight="700" fill="#0d9488" text-anchor="end">the response lives here</text>
  <text x="228" y="64" font-size="11" fill="#0d9488" text-anchor="end">&#969;&#8345; = 2 rad/s</text>
  <line x1="462.2" y1="96" x2="462.2" y2="84" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="466" y="78" font-size="12" font-weight="700" fill="#7c3aed">the noise reaches here</text>
  <text x="466" y="64" font-size="11" fill="#7c3aed">&#960;/T&#8347; = 314 rad/s</text>

  <!-- ================= right column ================= -->
  <rect x="546" y="96" width="334" height="156" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2" rx="6"/>
  <text x="562" y="120" font-size="15" font-weight="700" fill="#1e293b">The two operators</text>
  <text x="562" y="146" font-size="15" fill="#dc2626">ideal&#8194;&#8194;&#8194;K&#8340; s</text>
  <text x="562" y="168" font-size="13" fill="#334155">gain = K&#8340;&#969;. Double the frequency,</text>
  <text x="562" y="185" font-size="13" fill="#334155">double the gain, for ever.</text>
  <text x="562" y="207" font-size="15" fill="#1d4ed8">pseudo&#8194;K&#8340; N s / (s + N)</text>
  <text x="562" y="224" font-size="13" fill="#334155">the same slope up to &#969; = N, then flat</text>
  <text x="562" y="241" font-size="13" fill="#334155">at K&#8340;N. That ceiling is the whole idea.</text>

  <rect x="546" y="266" width="334" height="106" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" rx="6"/>
  <text x="562" y="290" font-size="15" font-weight="700" fill="#1e293b">Why it matters</text>
  <text x="562" y="314" font-size="13" fill="#334155">Noise is the FASTEST thing in a</text>
  <text x="562" y="331" font-size="13" fill="#334155">measurement. The ideal derivative</text>
  <text x="562" y="348" font-size="13" fill="#334155">finds it and multiplies it by the</text>
  <text x="562" y="365" font-size="13" fill="#334155">largest number on the curve.</text>

  <rect x="546" y="384" width="334" height="76" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="6"/>
  <text x="562" y="406" font-size="15" font-weight="700" fill="#1e293b">Measured in section I</text>
  <text x="562" y="424" font-size="13" fill="#334155">quiet-state RMS of the actuator:</text>
  <text x="562" y="442" font-size="13" fill="#334155">ideal <tspan font-weight="700">8.75</tspan>&#8194;&#8226;&#8194;N = 10 <tspan font-weight="700">0.23</tspan>&#8194;&#8194;peak <tspan font-weight="700">105.9</tspan> vs <tspan font-weight="700">4.3</tspan></text>
  
  <text x="20" y="462" font-size="12" fill="#94a3b8">Curves computed from |K&#8340; jw| and |K&#8340; N jw/(jw+N)| by _tools/w02_pseudo_geo.awk, K&#8340; = 2.</text>
