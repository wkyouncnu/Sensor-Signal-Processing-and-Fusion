<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500"
     font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <!-- saturation-curve coordinates computed by _tools/w02_windup_geo.awk -->
  <defs>
    <marker id="wk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#334155"/></marker>
    <marker id="wv" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/></marker>
  </defs>

  <text x="20" y="30" font-size="19" font-weight="700" fill="#1e293b">Windup is not a fault of the integrator. It is what an integrator does to an open loop.</text>
  <text x="20" y="52" font-size="15" fill="#64748b">While the actuator sits on its limit the feedback path is cut, and the integrator keeps integrating an error it can no longer affect</text>

  <!-- ============================================================= -->
  <!-- 1  the loop                                                    -->
  <!-- ============================================================= -->
  <text x="30" y="88" font-size="16" font-weight="700" fill="#1e293b">1&#8194; where the loop breaks</text>

  <!-- error junction -->
  <circle cx="72" cy="150" r="12" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="72" y="155" font-size="14" fill="#334155" text-anchor="middle">&#8722;</text>
  <line x1="30" y1="150" x2="58" y2="150" stroke="#334155" stroke-width="1.6" marker-end="url(#wk)"/>
  <text x="32" y="142" font-size="12" fill="#334155">u_d</text>
  <text x="92" y="143" font-size="12" fill="#334155">e</text>

  <!-- Kp and the integrator -->
  <rect x="118" y="108" width="62" height="30" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4" rx="3"/>
  <text x="149" y="128" font-size="13" fill="#1e293b" text-anchor="middle">Kp</text>
  <rect x="118" y="162" width="62" height="30" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" rx="3"/>
  <text x="149" y="182" font-size="13" fill="#1e293b" text-anchor="middle">Ki / s</text>
  <text x="168" y="214" font-size="12" font-weight="700" fill="#dc2626">the state I</text>

  <line x1="84" y1="150" x2="100" y2="150" stroke="#334155" stroke-width="1.6"/>
  <line x1="100" y1="123" x2="100" y2="177" stroke="#334155" stroke-width="1.6"/>
  <line x1="100" y1="123" x2="112" y2="123" stroke="#334155" stroke-width="1.6" marker-end="url(#wk)"/>
  <line x1="100" y1="177" x2="112" y2="177" stroke="#334155" stroke-width="1.6" marker-end="url(#wk)"/>

  <!-- sum -->
  <circle cx="222" cy="150" r="12" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="222" y="155" font-size="14" fill="#334155" text-anchor="middle">+</text>
  <line x1="180" y1="123" x2="206" y2="123" stroke="#334155" stroke-width="1.6"/>
  <line x1="180" y1="177" x2="206" y2="177" stroke="#334155" stroke-width="1.6"/>
  <line x1="206" y1="123" x2="206" y2="177" stroke="#334155" stroke-width="1.6"/>
  <line x1="206" y1="150" x2="208" y2="150" stroke="#334155" stroke-width="1.6"/>

  <!-- saturation -->
  <rect x="278" y="132" width="64" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" rx="3"/>
  <polyline points="288,160 300,160 320,140 332,140" fill="none" stroke="#d97706" stroke-width="2"/>
  <line x1="234" y1="150" x2="272" y2="150" stroke="#334155" stroke-width="1.6" marker-end="url(#wk)"/>
  <text x="253" y="141" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">X_cmd</text>

  <!-- plant -->
  <rect x="396" y="132" width="60" height="36" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" rx="3"/>
  <text x="426" y="155" font-size="13" fill="#1e293b" text-anchor="middle">hull</text>
  <line x1="342" y1="150" x2="390" y2="150" stroke="#334155" stroke-width="1.6" marker-end="url(#wk)"/>
  <text x="366" y="182" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">X_sat</text>
  <line x1="456" y1="150" x2="476" y2="150" stroke="#334155" stroke-width="1.6"/>
  <text x="464" y="141" font-size="12" fill="#334155">u</text>

  <!-- feedback -->
  <line x1="470" y1="150" x2="470" y2="232" stroke="#334155" stroke-width="1.6"/>
  <line x1="470" y1="232" x2="72" y2="232" stroke="#334155" stroke-width="1.6"/>
  <line x1="72" y1="232" x2="72" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#wk)"/>

  <!-- the cut, on the sat->hull wire -->
  <line x1="358" y1="134" x2="374" y2="166" stroke="#dc2626" stroke-width="3"/>
  <line x1="374" y1="134" x2="358" y2="166" stroke="#dc2626" stroke-width="3"/>
  <text x="366" y="126" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">cut</text>

  <!-- the anti-windup path -->
  <line x1="310" y1="168" x2="310" y2="284" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="310" y1="284" x2="149" y2="284" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="149" y1="284" x2="149" y2="198" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#wv)"/>
  <text x="322" y="278" font-size="13" font-weight="700" fill="#7c3aed">both cures add this one path</text>
  <text x="322" y="296" font-size="13" fill="#7c3aed">it carries X_cmd &#8722; X_sat</text>

  <rect x="30" y="316" width="440" height="76" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" rx="6"/>
  <text x="44" y="338" font-size="14" font-weight="700" fill="#1e293b">What the red cross means</text>
  <text x="44" y="358" font-size="13" fill="#334155">On the limit, X_sat stops following X_cmd. Nothing the controller</text>
  <text x="44" y="376" font-size="13" fill="#334155">does reaches the hull, so e never changes sign and I only grows.</text>

  <rect x="30" y="402" width="440" height="86" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2" rx="6"/>
  <text x="44" y="424" font-size="14" font-weight="700" fill="#1e293b">Why that signal, and no other</text>
  <text x="44" y="444" font-size="13" fill="#334155">X_cmd &#8722; X_sat is <tspan font-weight="700">exactly zero whenever the actuator follows</tspan>, so</text>
  <text x="44" y="462" font-size="13" fill="#334155">an unsaturated loop cannot tell whether anti-windup is fitted. It is</text>
  <text x="44" y="480" font-size="13" fill="#334155">a repair that stays invisible until the moment it is needed.</text>

  <!-- ============================================================= -->
  <!-- 2  the saturation block to scale                               -->
  <!-- ============================================================= -->
  <text x="512" y="88" font-size="16" font-weight="700" fill="#1e293b">2&#8194; how far outside the limit the demand went</text>
  <text x="512" y="108" font-size="13" fill="#64748b">the saturation block drawn to scale, with the measured peak</text>

  <rect x="545" y="130" width="325" height="200" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="583.7" y1="130" x2="583.7" y2="330" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="545" y1="248.5" x2="870" y2="248.5" stroke="#cbd5e1" stroke-width="1"/>

  <polyline points="545,297.9 573.4,297.9 602.2,159.9 870,159.9"
            fill="none" stroke="#d97706" stroke-width="3"/>

  <line x1="545" y1="159.9" x2="870" y2="159.9" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="620" y="153" font-size="12" fill="#d97706">X_sat can never exceed 239.36 N</text>

  <line x1="853" y1="330" x2="853" y2="159.9" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="853" cy="159.9" r="5" fill="#dc2626"/>
  <text x="848" y="182" font-size="12" font-weight="700" fill="#dc2626" text-anchor="end">3480 N asked for</text>
  <text x="848" y="197" font-size="12" fill="#dc2626" text-anchor="end">239 N delivered</text>

  <text x="583.7" y="346" font-size="11" fill="#64748b" text-anchor="middle">0</text>
  <text x="699.8" y="346" font-size="11" fill="#64748b" text-anchor="middle">1500</text>
  <text x="815.8" y="346" font-size="11" fill="#64748b" text-anchor="middle">3000</text>
  <text x="707" y="370" font-size="13" fill="#334155" text-anchor="middle">X_cmd &#8212; the force the controller asked for  [N]</text>
  <text x="527" y="230" font-size="13" fill="#334155" text-anchor="middle" transform="rotate(-90 527 230)">X_sat  [N]</text>

  <rect x="490" y="402" width="380" height="86" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" rx="6"/>
  <text x="504" y="424" font-size="14" font-weight="700" fill="#1e293b">Measured in section F</text>
  <text x="504" y="444" font-size="13" fill="#334155">The integrator reached <tspan font-weight="700">3438 N</tspan> against a largest useful</text>
  <text x="504" y="462" font-size="13" fill="#334155">value of <tspan font-weight="700">239 N</tspan> &#8212; a <tspan font-weight="700">14.5&#215;</tspan> overdraft that must be paid</text>
  <text x="504" y="480" font-size="13" fill="#334155">back before the loop responds at all: <tspan font-weight="700">13.98 s</tspan> of it.</text>
</svg>
