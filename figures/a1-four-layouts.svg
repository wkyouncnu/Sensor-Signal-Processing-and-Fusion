<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534"
     font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="534" fill="#ffffff"/>
  <!-- generated by _tools/a1_layouts_geo.awk from otter_config.m geometry -->
  <defs>
    <marker id="lt" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#1d4ed8"/></marker>
    <marker id="lg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/></marker>
  </defs>

  <text x="20" y="30" font-size="19" font-weight="700" fill="#1e293b">The rank of B is decided by the picture, not by the arithmetic.</text>
  <text x="20" y="52" font-size="15" fill="#64748b">Four layouts on one hull. Only the first has an empty sway row, and only the first has rank 2 &#8212; those are the same statement.</text>

  <!-- ============ base ============ -->
  <text x="30" y="98" font-size="15" font-weight="700" fill="#1e293b">base</text>
  <text x="30" y="115" font-size="12" fill="#64748b">two fixed propellers</text>
  <rect x="70.2" y="148.0" width="145.6" height="10.9" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="70.2" y="189.1" width="145.6" height="10.9" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="80.2" y="153.5" width="125.6" height="41.1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" opacity="0.8"/>
  <text x="179.8" y="220.5" font-size="11" fill="#94a3b8">bow &#8594;</text>
  <rect x="124.5" y="148.0" width="11" height="11" fill="#1e293b"/>
  <line x1="137.0" y1="153.5" x2="160.0" y2="153.5" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#lt)"/>
  <rect x="124.5" y="189.0" width="11" height="11" fill="#1e293b"/>
  <line x1="137.0" y1="194.5" x2="160.0" y2="194.5" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#lt)"/>
  <text x="30" y="234" font-size="13" fill="#334155">columns <tspan font-weight="700">2</tspan>&#8194;&#8226;&#8194;rank <tspan font-weight="700" fill="#dc2626">2</tspan>&#8194;&#8226;&#8194;null <tspan font-weight="700">0</tspan></text>
  <text x="30" y="254" font-size="13" font-weight="700" fill="#dc2626">sway row empty &#8212; Y can never be produced</text>

  <!-- ============ aft_azimuth ============ -->
  <text x="470" y="98" font-size="15" font-weight="700" fill="#1e293b">aft_azimuth</text>
  <text x="470" y="115" font-size="12" fill="#64748b">the same two, now steerable</text>
  <rect x="510.2" y="148.0" width="145.6" height="10.9" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="510.2" y="189.1" width="145.6" height="10.9" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="520.2" y="153.5" width="125.6" height="41.1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" opacity="0.8"/>
  <text x="619.8" y="220.5" font-size="11" fill="#94a3b8">bow &#8594;</text>
  <circle cx="518.0" cy="153.5" r="6.5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="526.0" y1="153.5" x2="546.0" y2="153.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <line x1="518.0" y1="145.5" x2="518.0" y2="127.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <circle cx="518.0" cy="194.5" r="6.5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="526.0" y1="194.5" x2="546.0" y2="194.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <line x1="518.0" y1="186.5" x2="518.0" y2="168.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <text x="470" y="234" font-size="13" fill="#334155">columns <tspan font-weight="700">4</tspan>&#8194;&#8226;&#8194;rank <tspan font-weight="700" fill="#0d9488">3</tspan>&#8194;&#8226;&#8194;null <tspan font-weight="700">1</tspan></text>
  <text x="470" y="254" font-size="13" fill="#0d9488">1-dimensional null space: infinitely many solutions</text>

  <!-- ============ bow_thruster ============ -->
  <text x="30" y="300" font-size="15" font-weight="700" fill="#1e293b">bow_thruster</text>
  <text x="30" y="317" font-size="12" fill="#64748b">two fixed + a bow tunnel</text>
  <rect x="70.2" y="350.0" width="145.6" height="10.9" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="70.2" y="391.1" width="145.6" height="10.9" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="80.2" y="355.5" width="125.6" height="41.1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" opacity="0.8"/>
  <text x="179.8" y="422.5" font-size="11" fill="#94a3b8">bow &#8594;</text>
  <rect x="124.5" y="350.0" width="11" height="11" fill="#1e293b"/>
  <line x1="137.0" y1="355.5" x2="160.0" y2="355.5" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#lt)"/>
  <rect x="124.5" y="391.0" width="11" height="11" fill="#1e293b"/>
  <line x1="137.0" y1="396.5" x2="160.0" y2="396.5" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#lt)"/>
  <rect x="202.5" y="370.5" width="11" height="11" fill="#1e293b"/>
  <line x1="208.0" y1="383.0" x2="208.0" y2="404.0" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#lt)"/>
  <line x1="208.0" y1="369.0" x2="208.0" y2="348.0" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#lt)"/>
  <text x="30" y="436" font-size="13" fill="#334155">columns <tspan font-weight="700">3</tspan>&#8194;&#8226;&#8194;rank <tspan font-weight="700" fill="#0d9488">3</tspan>&#8194;&#8226;&#8194;null <tspan font-weight="700">0</tspan></text>
  <text x="30" y="456" font-size="13" fill="#0d9488">square: one solution, nothing to optimise</text>

  <!-- ============ quad_tilt ============ -->
  <text x="470" y="300" font-size="15" font-weight="700" fill="#1e293b">quad_tilt</text>
  <text x="470" y="317" font-size="12" fill="#64748b">four steerable</text>
  <rect x="510.2" y="350.0" width="145.6" height="10.9" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="510.2" y="391.1" width="145.6" height="10.9" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="520.2" y="355.5" width="125.6" height="41.1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" opacity="0.8"/>
  <text x="619.8" y="422.5" font-size="11" fill="#94a3b8">bow &#8594;</text>
  <circle cx="648.0" cy="355.5" r="6.5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="656.0" y1="355.5" x2="676.0" y2="355.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <line x1="648.0" y1="347.5" x2="648.0" y2="329.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <circle cx="648.0" cy="396.5" r="6.5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="656.0" y1="396.5" x2="676.0" y2="396.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <line x1="648.0" y1="388.5" x2="648.0" y2="370.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <circle cx="518.0" cy="355.5" r="6.5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="526.0" y1="355.5" x2="546.0" y2="355.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <line x1="518.0" y1="347.5" x2="518.0" y2="329.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <circle cx="518.0" cy="396.5" r="6.5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="526.0" y1="396.5" x2="546.0" y2="396.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <line x1="518.0" y1="388.5" x2="518.0" y2="370.5" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <text x="470" y="436" font-size="13" fill="#334155">columns <tspan font-weight="700">8</tspan>&#8194;&#8226;&#8194;rank <tspan font-weight="700" fill="#0d9488">3</tspan>&#8194;&#8226;&#8194;null <tspan font-weight="700">5</tspan></text>
  <text x="470" y="456" font-size="13" fill="#0d9488">5-dimensional null space: infinitely many solutions</text>
  <rect x="30" y="472" width="840" height="50" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="6"/>
  <text x="46" y="489" font-size="14" fill="#334155">A tilting thruster contributes <tspan font-weight="700">two columns</tspan>, one per Cartesian component of its thrust. That is how aft_azimuth reaches rank 3 with</text>
  <text x="46" y="508" font-size="14" fill="#334155">the same two physical machines as base: <tspan font-weight="700">the third degree of freedom is bought with servos, not with thrusters.</tspan></text>
</svg>
